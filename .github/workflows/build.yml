name: Build AOSiP for Redmi Note 10 Pro (sweet)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Create Swap Space
        run: |
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bisector build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev libgl1-mesa-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-11-jdk

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize ROM Source
        run: |
          mkdir -p ~/rom
          cd ~/rom
          git config --global user.name "Maksudur"
          git config --global user.email "your-email@example.com"
          repo init -u https://github.com/AOSiP/platform_manifest.git -b vic --depth=1

      - name: Sync Device, Vendor & Kernel Trees
        run: |
          cd ~/rom
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/sweet.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/xiaomi/sweet" name="LineageOS/android_device_xiaomi_sweet" remote="github" revision="lineage-21.0" />
            <project path="device/xiaomi/sm6150-common" name="LineageOS/android_device_xiaomi_sm6150-common" remote="github" revision="lineage-21.0" />
            <project path="vendor/xiaomi/sweet" name="itsshashanksp/vendor_xiaomi_sweet" remote="github" revision="thirteen" />
            <project path="vendor/xiaomi/sm6150-common" name="itsshashanksp/vendor_xiaomi_sm6150-common" remote="github" revision="thirteen" />
            <project path="kernel/xiaomi/sm6150" name="LineageOS/android_kernel_xiaomi_sm6150" remote="github" revision="lineage-21.0" />
          </manifest>
          EOF
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

      - name: Set Memory & Build Environment Variables
        run: |
          echo "NEW_TMPDIR=$HOME/tmp" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=/usr/bin/ccache" >> $GITHUB_ENV
          echo "_JAVA_OPTIONS=-Xmx4g" >> $GITHUB_ENV
          echo "SOONG_UI_NUM_PARALLEL_JOBS=4" >> $GITHUB_ENV

      - name: Build AOSiP ROM
        run: |
          cd ~/rom
          export CCACHE_DIR=~/.ccache
          ccache -M 10G
          source build/envsetup.sh
          lunch aosip_sweet-userdebug
          mka kronic -j4

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AOSiP-sweet-Build
          path: |
            ~/rom/out/target/product/sweet/*.zip
            ~/rom/out/target/product/sweet/boot.img
